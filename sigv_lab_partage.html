<style>
#sigv-app {
  position: relative;
  width: 100%;
  height: calc(100vh - 76px); height: calc(100dvh - 76px); min-height: 360px;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
#sigv-map {
  width: 100%;
  height: 100%;
}
#sigv-panel {
  position: absolute;
  top: 0;
  right: 0;
  width: min(310px, 82%);
  height: 100%;
  box-sizing: border-box;
  padding: 16px;
  background: #f6f8f6;
  box-shadow: -3px 0 14px #0003;
  overflow-y: auto;
  z-index: 1000;
  transform: translateX(105%);
  transition: transform 0.25s ease;
}
#sigv-panel.open {
  transform: translateX(0);
}
#sigv-panel h3 {
  color: #247a45;
  margin: 5px 0;
}
#sigv-panel label {
  display: block;
  margin-top: 12px;
  font-size: 12px;
  font-weight: bold;
}
#sigv-panel input {
  width: 100%;
  padding: 9px;
  margin-top: 5px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 5px;
}
.sigv-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 11px;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}
#sigv-save {
  background: #247a45;
  color: white;
}
#sigv-streetview {
  background: #e2e9ff;
  color: #234ca0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
#sigv-streetview svg { width: 21px; height: 21px; flex-shrink: 0; }
#sigv-header {
  box-sizing: border-box;
  height: 76px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: #173d30;
  color: #fff;
  font-family: Arial, sans-serif;
}
#sigv-header h1 { font-size: 21px; margin: 0 0 4px; font-weight: 700; }
#sigv-header p { margin: 0; font-size: 12px; color: #c8e1d3; }
#sigv-header .sigv-tag { font-size: 11px; border: 1px solid #91baa2; border-radius: 20px; padding: 6px 10px; white-space: nowrap; }
@media (max-width: 520px) {
  #sigv-header { padding: 10px 12px; }
  #sigv-header h1 { font-size: 17px; }
  #sigv-header p { font-size: 10px; }
  #sigv-header .sigv-tag { font-size: 10px; padding: 5px 7px; }
}
#sigv-export {
  background: #e4e8e4;
  color: #263b2c;
}
#sigv-close {
  float: right;
  border: none;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
}
#sigv-message {
  font-size: 12px;
  color: #247a45;
}
#sigv-export-map {
  position: absolute;
  bottom: 25px;
  left: 12px;
  z-index: 900;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: white;
  box-shadow: 0 2px 8px #0003;
  cursor: pointer;
}
</style>

  const map = L.map('sigv-map').setView(
    [48.8566, 2.3522], 12
  );

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }
  ).addTo(map);

  const panel = document.getElementById('sigv-panel');
  const message = document.getElementById('sigv-message');

  let selectedLayer = null;

  const couche = L.geoJSON(data, {
    style: {
      color: '#247a45',
      fillColor: '#65b77b',
      fillOpacity: 0.5,
      weight: 2
    },
    onEachFeature: function(feature, layer) {
      layer.on('click', function() {
        selectedLayer = layer;
        const p = layer.feature.properties;

        document.getElementById('sigv-nom').value =
          p.nom_ev ?? '';

        document.getElementById('sigv-categorie').value =
          p.categorie ?? '';

        document.getElementById('sigv-annee').value =
          p.annee_ouverture ?? '';

        document.getElementById('sigv-surface').value =
          p.surface_totale_reelle ?? '';

        message.textContent = '';
        couche.resetStyle();

        layer.setStyle({
          color: '#ff8800',
          weight: 4
        });

        panel.classList.add('open');
      });
    }
  }).addTo(map);

  // Fermer le panneau
  document.getElementById('sigv-close').onclick =
    function() {
      panel.classList.remove('open');
      selectedLayer = null;
      couche.resetStyle();
    };

  // Enregistrer les attributs en mémoire
  document.getElementById('sigv-save').onclick =
    function() {
      if (!selectedLayer) return;

      const p = selectedLayer.feature.properties;

      p.nom_ev =
        document.getElementById('sigv-nom').value;

      p.categorie =
        document.getElementById('sigv-categorie').value;

      const annee =
        document.getElementById('sigv-annee').value;

      p.annee_ouverture =
        annee === '' ? null : Number(annee);

      const surface =
        document.getElementById('sigv-surface').value;

      p.surface_totale_reelle =
        surface === '' ? null : Number(surface);

      message.textContent =
        '✓ Attributs enregistrés dans la carte';
    };

  // Ouvrir Google Street View
  document.getElementById('sigv-streetview').onclick =
    function() {
      if (!selectedLayer) return;

      const point = selectedLayer.getBounds().getCenter();

      const url =
        'https://www.google.com/maps/@?api=1' +
        '&map_action=pano' +
        '&viewpoint=' + point.lat + ',' + point.lng;

      window.open(url, '_blank');
    };

  // Groupe pour les nouveaux polygones
  const nouveaux = L.featureGroup().addTo(map);

  map.on('pm:create', function(e) {
    const layer = e.layer;
    layer.feature = {
      type: 'Feature',
      properties: {
        nom_ev: 'Nouvel espace vert',
        categorie: '',
        annee_ouverture: null,
        surface_totale_reelle: null
      }
    };

    nouveaux.addLayer(layer);
  });

  // Exporter les géométries actuelles et les attributs
  function exporterGeoJSON() {
    const features = [];

    function ajouter(layer) {
      if (!map.hasLayer(layer)) return;

      const feature = layer.toGeoJSON();

      feature.properties =
        layer.feature?.properties || {};

      features.push(feature);
    }

    couche.eachLayer(ajouter);
    nouveaux.eachLayer(ajouter);

    const resultat = {
      type: 'FeatureCollection',
      features: features
    };

    const blob = new Blob(
      [JSON.stringify(resultat, null, 2)],
      {type: 'application/geo+json'}
    );

    const url = URL.createObjectURL(blob);
    const lien = document.createElement('a');

    lien.href = url;
    lien.download = 'sigv_lab_modifications.geojson';
    document.body.appendChild(lien);
    lien.click();
    lien.remove();

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  document.getElementById('sigv-export').onclick =
    exporterGeoJSON;

  document.getElementById('sigv-export-map').onclick =
    exporterGeoJSON;

  // Outils Leaflet-Geoman
  map.pm.addControls({
    position: 'topleft',
    drawMarker: false,
    drawCircle: false,
    drawCircleMarker: false,
    drawPolyline: false,
    drawRectangle: false,
    drawPolygon: true,
    editMode: true,
    dragMode: true,
    removalMode: true
  });

  if (couche.getLayers().length > 0) {
    map.fitBounds(couche.getBounds());
  }

  setTimeout(function() {
    map.invalidateSize();
  }, 400);
})();
